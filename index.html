<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaishnavi Home Salon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff5f7;
            color: #333;
        }
        header {
            background-color: #d81b60;
            color: white;
            text-align: center;
            padding: 25px 15px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
        }
        .section-title {
            color: #ad1457;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .service-card {
            background: white;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #d81b60;
        }
        .service-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #333;
        }
        .service-info p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }
        .price {
            font-weight: bold;
            font-size: 16px;
            color: #d81b60;
        }
        .booking-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            margin-top: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            font-size: 13px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .whatsapp-btn {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .whatsapp-btn:hover {
            background-color: #1eb853;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vaishnavi Home Salon</h1>
        <p>Ghar Baithe Professional Beauty Services</p>
    </header>

    <div class="container">
        <div class="section-title">Our Services</div>
        
        <div class="service-card">
            <div class="service-info">
                <h3>Hair Cut & Styling</h3>
                <p>30 Mins • Professional Cut</p>
            </div>
            <div class="price">₹299</div>
        </div>

        <div class="service-card">
            <div class="service-info">
                <h3>Herbal Facial</h3>
                <p>45 Mins • Glow Care</p>
            </div>
            <div class="price">₹499</div>
        </div>

        <div class="service-card">
            <div class="service-info">
                <h3>Bridal Glow Package</h3>
                <p>90 Mins • Complete Care</p>
            </div>
            <div class="price">₹1,499</div>
        </div>

        <!-- Booking Form -->
        <div class="booking-card">
            <div class="section-title" style="margin-top:0;">Book Appointment</div>
            <form id="salonForm">
                <label>Aapka Naam (Customer Name):</label>
                <input type="text" id="name" placeholder="Apna naam likhein" required>

                <label>Mobile Number:</label>
                <input type="tel" id="phone" placeholder="10-digit number" required>

                <label>Service Choose Karein:</label>
                <select id="service">
                    <option value="Hair Cut & Styling (₹299)">Hair Cut & Styling (₹299)</option>
                    <option value="Herbal Facial (₹499)">Herbal Facial (₹499)</option>
                    <option value="Bridal Glow Package (₹1499)">Bridal Glow Package (₹1,499)</option>
                </select>

                <label>Date (Taareekh):</label>
                <input type="date" id="date" required>

                <button type="button" class="whatsapp-btn" onclick="sendToWhatsApp()">
                    📲 Book via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            // Owner ka Mobile Number yahan likhein (country code 91 ke saath)
            var ownerPhoneNumber = "919482227491"; // <-- YAHAN APNA WHATSAPP NUMBER DALEIN

            var name = document.getElementById('name').value;
            var phone = document.getElementById('phone').value;
            var service = document.getElementById('service').value;
            var date = document.getElementById('date').value;

            if (name === '' || phone === '' || date === '') {
                alert('Kripya saari details bharein!');
                return;
            }

            // Professional WhatsApp Message Format
            var message = "Hello Vaishnavi Home Salon! 👋%0A%0A" +
                "Mujhey appointment book karna hai:%0A" +
                "👤 *Naam:* " + encodeURIComponent(name) + "%0A" +
                "📞 *Mobile:* " + encodeURIComponent(phone) + "%0A" +
                "💅 *Service:* " + encodeURIComponent(service) + "%0A" +
                "📅 *Date:* " + encodeURIComponent(date) + "%0A%0A" +
                "Kripya meri booking confirm karein. Dhanyawad!";

            var whatsappUrl = "https://wa.me/" + ownerPhoneNumber + "?text=" + message;
            
            // Direct WhatsApp kholne ke liye
            window.open(whatsappUrl, '_blank');
        }
    </script>

</body>
</html>
